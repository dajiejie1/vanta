name: Build Vanta ISO

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  iso:
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - name: Free build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
        with:
          remove-codeql: true

      - name: Check out Vanta
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Resolve Vanta image
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "IMAGE_REF=ghcr.io/${owner}/vanta:latest" >> "$GITHUB_ENV"

      - name: Build Fedora 45 installer environment
        run: |
          sudo podman build \
            --build-arg "VANTA_IMAGE=${IMAGE_REF}" \
            -f installer/Containerfile \
            -t localhost/vanta-installer:latest .

      - name: Build installer ISO
        run: |
          mkdir -p output
          sudo podman run --privileged --rm \
            -v "${GITHUB_WORKSPACE}/output:/output" \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            ghcr.io/osbuild/image-builder-cli:latest \
            --bootc-ref localhost/vanta-installer:latest \
            --bootc-default-fs ext4 \
            build bootc-generic-iso
          sudo chown -R "$(id -u):$(id -g)" output

      - name: Checksum ISO
        run: |
          cd output
          find . -type f -name '*.iso' -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS
          test -s SHA256SUMS

      - name: Upload ISO
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: vanta-iso
          path: output/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
