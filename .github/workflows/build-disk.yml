name: Build Vanta ISO

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  id-token: write

jobs:
  iso:
    runs-on: ubuntu-26.04
    steps:
      - name: Free build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
        with:
          remove-codeql: true

      - name: Check out Vanta
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Resolve Vanta image
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "IMAGE_REF=ghcr.io/${owner}/vanta:latest" >> "$GITHUB_ENV"

      - name: Authenticate to GitHub Container Registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GH_TOKEN" | podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Render installer image reference
        run: |
          sed -i "s#VANTA_IMAGE_REF#${IMAGE_REF}#g" disk_config/iso.toml
          ! grep -q VANTA_IMAGE_REF disk_config/iso.toml
          grep -F "${IMAGE_REF}" disk_config/iso.toml

      - name: Build installer ISO
        id: build
        uses: osbuild/bootc-image-builder-action@8661cd3832544ad68c12dcde8681b13ab0f56a8d
        with:
          builder-image: quay.io/centos-bootc/bootc-image-builder:latest
          config-file: ./disk_config/iso.toml
          image: ${{ env.IMAGE_REF }}
          types: anaconda-iso
          additional-args: --use-librepo=True

      - name: Checksum ISO
        env:
          OUTPUT_DIR: ${{ steps.build.outputs.output-directory }}
        run: |
          cd "$OUTPUT_DIR"
          find . -type f -name '*.iso' -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS
          test -s SHA256SUMS

      - name: Upload ISO
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: vanta-iso
          path: ${{ steps.build.outputs.output-directory }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0